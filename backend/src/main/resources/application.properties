server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_energy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

app.dataset.path=classpath:data/Steel_Industry_Simulated_6_Months_2026.csv
app.auth.enabled=true